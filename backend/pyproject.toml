[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projecta-backend"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.11"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "python-dotenv",
  "python-jose",
  "passlib[bcrypt]",
  "redis",
  "boto3",
  # ????????: ????????????? DB/ORM/?????????????? ???
  "pymysql",
  "sqlalchemy",
  "alembic",
]

