apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-prod-secrets
  namespace: app-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: api-prod-secrets
    creationPolicy: Owner
  data:
    # All values are sourced from a single AWS secret: app-prod-secrets
    - secretKey: db_password
      remoteRef:
        key: app-prod-secrets
        property: DB_PASSWORD
    - secretKey: jwt_secret_key
      remoteRef:
        key: app-prod-secrets
        property: JWT_SECRET_KEY
