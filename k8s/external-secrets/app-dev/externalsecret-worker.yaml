apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: worker-secrets
  namespace: app-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: worker-secrets
    creationPolicy: Owner
  data:
    # All values are sourced from a single AWS secret: app-dev-secrets
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: app-dev-secrets
        property: OPENAI_API_KEY
    - secretKey: DB_PASSWORD
      remoteRef:
        key: app-dev-secrets
        property: DB_PASSWORD
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: app-dev-secrets
        property: JWT_SECRET_KEY
