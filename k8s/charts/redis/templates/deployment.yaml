apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: {{ .Values.service.port }}
          args: ["--bind","0.0.0.0","--protected-mode","no","--appendonly","no"]

          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10

          # resources는 "인라인(JSON)"로 렌더해서 들여쓰기 이슈를 원천 차단
          resources: {{ .Values.resources | toJson }}

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          {{ if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: redis-pvc
          {{ else }}
          emptyDir: {}
          {{ end }}
