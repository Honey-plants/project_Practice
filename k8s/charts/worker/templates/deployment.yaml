apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "worker.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "worker.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
         {{- with .Values.podLabels }}
         {{- toYaml . | nindent 8 }}
         {{- end }}
         {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "worker.serviceAccountName" . }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          env:
            - name: PYTHONPATH
              value: "/app"

          command: ["python"]
          args: ["-m", "app.worker"]

          envFrom:
            - configMapRef:
                name: {{ include "worker.fullname" . }}-config

                      {{- if and .Values.secrets.enabled .Values.secretMount.enabled }}
          volumeMounts:
            - name: app-secrets
              mountPath: {{ .Values.secretMount.mountPath }}
              readOnly: true
                        {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

            {{- if and .Values.secrets.enabled .Values.secretMount.enabled }}
      volumes:
        - name: app-secrets
          secret:
            secretName: {{ include "worker.fullname" . }}-secrets
                        {{- end }}

                        {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
        {{- end }}
