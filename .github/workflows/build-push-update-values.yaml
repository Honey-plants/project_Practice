name: build-push-update-values

on:
  pull_request:

  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com
  AWS_REGION: ap-northeast-2
  TAG: sha-${{ github.sha }}

  # haenet-xxx (dev values와 반드시 동일해야 함)
  API_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-api
  FRONTEND_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-frontend
  WORKER_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-worker-gpu

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      only_values: ${{ steps.detect.outputs.only_values }}
      code_changed: ${{ steps.detect.outputs.code_changed }}
      no_changes: ${{ steps.detect.outputs.no_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          def sh(cmd):
            return subprocess.check_output(cmd, shell=True, text=True).strip()

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          head = os.environ.get("GITHUB_SHA", "")
          if event == "pull_request":
            base_ref = os.environ.get("GITHUB_BASE_REF", "")
            if base_ref:
              sh(f"git fetch origin {base_ref} --depth=1")
              base = f"origin/{base_ref}"
            else:
              base = sh("git rev-parse HEAD^")
          else:
            base = os.environ.get("GITHUB_EVENT_BEFORE", "")
            if not base or set(base) == {"0"}:
              base = sh("git rev-parse HEAD^")

          diff = sh(f"git diff --name-only {base} {head}")
          files = [f for f in diff.splitlines() if f.strip()]

          only_values = bool(files) and all(f.startswith("k8s/env/") for f in files)
          code_changed = any(not f.startswith("k8s/env/") for f in files)
          no_changes = len(files) == 0

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"only_values={'true' if only_values else 'false'}\\n")
            fh.write(f"code_changed={'true' if code_changed else 'false'}\\n")
            fh.write(f"no_changes={'true' if no_changes else 'false'}\\n")

          print("changed files:", files)
          print("only_values:", only_values)
          print("code_changed:", code_changed)
          PY

  verify:
    name: verify (build only)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.only_values == 'true' || needs.changes.outputs.code_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify build (API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build (Worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build (Frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-and-bump-dev:
    name: build & push images, bump dev values
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push (API api-final)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (Worker runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (Frontend final)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update dev values tags (api/frontend/worker)
        run: |
          python - <<'PY'
          import pathlib, re

          tag = "sha-${{ github.sha }}"
          files = [
            pathlib.Path("k8s/env/dev/api-values.yaml"),
            pathlib.Path("k8s/env/dev/frontend-values.yaml"),
            pathlib.Path("k8s/env/dev/worker-menu-assistant-values.yaml"),
            pathlib.Path("k8s/env/dev/worker-journal-values.yaml"),
            pathlib.Path("k8s/env/dev/worker-review-values.yaml"),
          ]

          for p in files:
            if not p.exists():
              raise SystemExit(f"values file not found: {p}")

            s = p.read_text(encoding="utf-8")

            # Replace the first encountered "tag:" line only
            s2 = re.sub(r'(?m)^(\s*tag:\s*).*$',
                        r'\1"' + tag + r'"', s, count=1)

            if s2 == s:
              raise SystemExit(f"tag field not found to replace in {p}")

            if "REPLACE_ME" in s2:
              raise SystemExit(f"ERROR: REPLACE_ME still present after update in {p}")

            p.write_text(s2, encoding="utf-8")
            print("Updated:", p)
          PY

      - name: Commit & push values update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/env/dev/api-values.yaml k8s/env/dev/frontend-values.yaml k8s/env/dev/worker-menu-assistant-values.yaml k8s/env/dev/worker-journal-values.yaml k8s/env/dev/worker-review-values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "chore(dev): bump images to ${{ env.TAG }} [skip ci]"
          git push
