name: build-push-update-values

on:
  pull_request:
    paths-ignore:
      - "k8s/env/**"

  push:
    branches: ["main"]
    paths-ignore:
      - "k8s/env/**"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  TAG: sha-${{ github.sha }}

  # cicdex2-xxx (dev values와 반드시 동일해야 함)
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/cicdex2-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicdex2-frontend
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/cicdex2-worker

jobs:
  verify:
    name: verify (build only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify build (API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: api-final
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build (Worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.worker
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build (Frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: final
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-and-bump-dev:
    name: build & push images, bump dev values
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (API api-final)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: api-final
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (Worker runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.worker
          target: runtime
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (Frontend final)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: final
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update dev values tags (api/frontend/worker)
        run: |
          python - <<'PY'
          import pathlib, re

          tag = "sha-${{ github.sha }}"
          files = [
            pathlib.Path("k8s/env/dev/api-values.yaml"),
            pathlib.Path("k8s/env/dev/frontend-values.yaml"),
            pathlib.Path("k8s/env/dev/worker-values.yaml"),
          ]

          for p in files:
            if not p.exists():
              raise SystemExit(f"values file not found: {p}")

            s = p.read_text(encoding="utf-8")

            # Replace the first encountered "tag:" line only
            s2 = re.sub(r'(?m)^(\s*tag:\s*).*$',
                        r'\1"' + tag + r'"', s, count=1)

            if s2 == s:
              raise SystemExit(f"tag field not found to replace in {p}")

            if "REPLACE_ME" in s2:
              raise SystemExit(f"ERROR: REPLACE_ME still present after update in {p}")

            p.write_text(s2, encoding="utf-8")
            print("Updated:", p)
          PY

      - name: Commit & push values update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/env/dev/api-values.yaml k8s/env/dev/frontend-values.yaml k8s/env/dev/worker-values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "chore(dev): bump images to ${{ env.TAG }} [skip ci]"
          git push
