name: build-push-update-values

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/charts/**"
      - ".github/workflows/**"
      # IMPORTANT: values 업데이트 커밋이 다시 워크플로우를 트리거하지 않도록 env 폴더는 제외

permissions:
  contents: write
  packages: write

jobs:
  build_push_and_bump:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      SHA_SHORT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short tag
        id: vars
        run: |
          echo "TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # API image
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cicdex1-api:${{ steps.vars.outputs.TAG }}

      # Frontend image
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cicdex1-frontend:${{ steps.vars.outputs.TAG }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Helm values tags (dev)
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          yq -i ".image.tag = \"${TAG}\"" k8s/env/dev/api-values.yaml
          yq -i ".image.tag = \"${TAG}\"" k8s/env/dev/frontend-values.yaml

      - name: Guard - ensure no REPLACE_ME remains
        run: |
          if grep -R "REPLACE_ME" -n k8s/env/dev; then
            echo "ERROR: REPLACE_ME still present after update."
            exit 1
          fi

      - name: Commit & push values update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/env/dev/api-values.yaml k8s/env/dev/frontend-values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "chore(dev): bump images to ${{ steps.vars.outputs.TAG }}"
          git push
