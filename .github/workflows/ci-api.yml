name: ci-api

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "k8s/charts/api/**"
  pull_request:
    paths:
      - "backend/**"
      - "k8s/charts/api/**"

permissions:
  contents: write
  packages: write

jobs:
  build-push-and-bump-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image vars
        run: |
          echo "IMAGE_REPO=ghcr.io/${{ github.repository }}/api" >> $GITHUB_ENV
          echo "IMAGE_TAG=sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}

      - name: Update dev values tag (api)
        run: |
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("k8s/env/dev/api-values.yaml")
          s = p.read_text(encoding="utf-8")
          s2 = re.sub(r'(?m)^(\\s*tag:\\s*).*$',
                      r'\\1"sha-${{ github.sha }}"', s, count=1)
          if s2 == s:
            raise SystemExit("tag field not found to replace")
          p.write_text(s2, encoding="utf-8")
          print("Updated:", p)
          PY

      - name: Commit & push (dev tag bump)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/env/dev/api-values.yaml
          git commit -m "ci(dev): bump api image tag to sha-${{ github.sha }}"
          git push
