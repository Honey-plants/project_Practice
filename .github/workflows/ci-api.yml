name: ci-api

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "k8s/charts/api/**"
  pull_request:
    paths:
      - "backend/**"
      - "k8s/charts/api/**"

permissions:
  contents: write
  packages: write

jobs:
  verify-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # verify stage build (runs dpkg + import cv2 inside Dockerfile verify stage)
      - name: Build verify stage (API smoke tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: verify
          push: false
          load: false
          tags: local/api-verify:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-and-bump-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: verify-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image vars
        run: |
          echo "IMAGE_REPO=ghcr.io/${{ github.repository }}/api" >> $GITHUB_ENV
          echo "IMAGE_TAG=sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (API final)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: final
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update dev values tag (api)
        run: |
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("k8s/env/dev/api-values.yaml")
          s = p.read_text(encoding="utf-8")
          s2 = re.sub(r'(?m)^(\\s*tag:\\s*).*$',
                      r'\\1"sha-${{ github.sha }}"', s, count=1)
          if s2 == s:
            raise SystemExit("tag field not found to replace")
          p.write_text(s2, encoding="utf-8")
          print("Updated:", p)
          PY

      - name: Commit & push (dev tag bump)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/env/dev/api-values.yaml
          git commit -m "ci(dev): bump api image tag to sha-${{ github.sha }}"
          git push
